name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Production deploys hang off a green `verify`, so a red run cannot ship.
  # Vercel's own git auto-deploy is off (vercel.json → git.deploymentEnabled);
  # this project-scoped deploy hook is the only trigger left.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
