<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Geist Pixel';
    src: url('fonts/geist-pixel.woff2') format('woff2');
    font-weight: 400 700;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0A; }
  body {
    font-family: 'Geist Pixel', system-ui, sans-serif;
    color: #fff;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .watermark { position: absolute; right: -80px; top: 50%; transform: translateY(-50%); }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; letter-spacing: -.01em; }
  h1 { font-size: 72px; font-weight: 500; line-height: 1.08; letter-spacing: -.02em; }
  p { margin-top: 24px; font-size: 27px; line-height: 1.4; color: rgb(255 255 255 / 56%); }
  .url { font-size: 22px; color: rgb(255 255 255 / 46%); }
</style>
</head>
<body>
  <svg class="watermark" width="440" height="440" viewBox="0 0 24 24" fill="rgb(255 255 255 / 4%)" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>

  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="white" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    Video Downloader
  </div>

  <div>
    <h1>Save videos from<br>any public link</h1>
    <p>Paste a link from Instagram, X, YouTube, TikTok<br>and more — get the file in one click.</p>
  </div>

  <div class="url">download.maharshi.work</div>
</body>
</html>
