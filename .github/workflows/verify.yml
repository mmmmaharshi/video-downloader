name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run verify

  # Production deploys run from a workstation through `bun run deploy` (cf CLI,
  # ADR-0003). A CI deploy step would need Cloudflare credentials in this repo,
  # so CI answers one question only: is the tree green.
